version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/app
    overwrite: yes

permissions:
  - object: /home/ubuntu/app
    pattern: '**'
    owner: ubuntu
    group: ubuntu
    mode: 755
  - object: /home/ubuntu/app/scripts/deploy.sh
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 300
      runas: root