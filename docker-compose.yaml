version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: dev-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - beat-it-app
    networks:
      - chat-network

  beat-it-app:
    build: .
    container_name: beat-it-app
    expose:
      - "8080"
    volumes:
      - ./firebase-service-key.json:/app/firebase-service-key.json
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - FIREBASE_CONFIG_PATH=/app/firebase-service-key.json
    depends_on:
      - dev-db
      - dev-redis
      - dev-kafka
    networks:
      - chat-network

  dev-db:
    image: postgres:15-alpine
    container_name: dev-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - chat-network

  dev-redis:
    image: redis:alpine
    container_name: dev-redis
    ports:
      - "6379:6379"
    networks:
      - chat-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: dev-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    networks:
      - chat-network

  dev-kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: dev-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://dev-kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge