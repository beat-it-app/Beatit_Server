spring:
  profiles:
    default: local

  application:
    name: beat-it

  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_PASSWORD}
            scope:
              - openid
              - email

  kafka:
    consumer:
      group-id: chat-group
      auto-offset-reset: earliest
      key-deserializer: string
      value-deserializer: string
    producer:
      key-serializer: string
      value-serializer: string

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:v3rys3cr3tk3yf0rjwtm4k31tL0ng3n0ugh1234567890}
  expiration: 86400000 # 24 hours

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
