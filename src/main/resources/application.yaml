spring:
  application:
    name: beat-it
  datasource:
    url: jdbc:postgresql://localhost:5432/beatit_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

