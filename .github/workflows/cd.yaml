name: CD

on:
  push:
    branches: [ "develop", "main" ]

env:
  AWS_REGION: ap-northeast-2
  CODE_DEPLOY_APPLICATION_NAME: ${{ secrets.CODE_DEPLOY_APPLICATION_NAME }}
  DEV_S3_BUCKET: ${{ secrets.DEV_S3_BUCKET_NAME }}
  PROD_S3_BUCKET: ${{ secrets.PROD_S3_BUCKET_NAME }}
  DEV_DEPLOY_GROUP: ${{ secrets.DEV_CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}
  PROD_DEPLOY_GROUP: ${{ secrets.PROD_CODE_DEPLOY_DEPLOYMENT_GROUP_NAME }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Target Environment
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 Github-Action
        uses: actions/checkout@v4

      - name: 자바 JDK set up
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle set up
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 빌드
        run: ./gradlew clean build -x test

      - name: 배포 대상 환경(개발 vs 운영) 설정
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TARGET_ENV=production" >> $GITHUB_ENV
            echo "DEPLOY_S3_BUCKET=${{ env.PROD_S3_BUCKET }}" >> $GITHUB_ENV
            echo "DEPLOY_GROUP=${{ env.PROD_DEPLOY_GROUP }}" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=development" >> $GITHUB_ENV
            echo "DEPLOY_S3_BUCKET=${{ env.DEV_S3_BUCKET }}" >> $GITHUB_ENV
            echo "DEPLOY_GROUP=${{ env.DEV_DEPLOY_GROUP }}" >> $GITHUB_ENV
          fi

      - name: AWS 인증 (IAM 자격 증명 주입)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포용 압축 파일 생성
        run: |
          zip -r ${{ github.sha }}.zip \
            appspec.yml \
            scripts/ \
            Dockerfile \
            docker-compose.yaml \
            nginx/ \
            build/libs/*.jar

      - name: AWS S3 에 build 결과 업로드
        run: |
          aws s3 cp ${{ github.sha }}.zip s3://${{ env.DEPLOY_S3_BUCKET }}/${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }}

      - name: CodeDeploy 배포 실행
        run: |
          aws deploy create-deployment \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --application-name ${{ env.CODE_DEPLOY_APPLICATION_NAME }} \
            --deployment-group-name ${{ env.DEPLOY_GROUP }} \
            --s3-location bucket=${{ env.DEPLOY_S3_BUCKET }},key=${{ github.sha }}.zip,bundleType=zip \
            --region ${{ env.AWS_REGION }}